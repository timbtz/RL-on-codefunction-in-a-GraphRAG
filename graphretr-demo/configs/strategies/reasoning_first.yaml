# Strategy family "reasoning_first" -- the run-5 reasoning-rerank arm.
family: reasoning_first
seed: src/graphretr_opt/artifact/seeds/reasoning_first.py
notes: >
  G.extract routes the query, typed dense retrieval builds a bounded pool, and
  the fixed-prompt G.llm_rerank reasons about relational relevance to reorder
  it (with a conditional graph-expand + rerank second hop). The lever that
  attacks the run-4 ceiling directly: it can rank a text-dissimilar correct
  answer above a wordy decoy. The optimizer evolves the adaptive multi-hop
  branch logic in search.py only; the rerank prompt is fixed and not editable.
