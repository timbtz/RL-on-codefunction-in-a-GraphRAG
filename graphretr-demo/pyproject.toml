[project]
name = "graphretr-opt"
version = "0.1.0"
description = "Optimizer service that rewrites a search(q, G) program over a frozen graph environment (Stage-1 demo)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "src" -> graphretr_opt (the engine). ".." -> the monorepo root, so the sibling
# search services `starksearch` and `graphsearch` (carved out of the engine,
# 2026-06-25) import as packages during the test suite. Ordered after "src" so
# the engine wins any name lookup; the services have distinct top-level names.
pythonpath = ["src", ".."]
